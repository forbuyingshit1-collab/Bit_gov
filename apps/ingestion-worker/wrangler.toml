name = "bit-gov-ingestion-staging"
main = "src/index.js"
compatibility_date = "2026-09-04"

[[d1_databases]]
binding = "DB"
database_name = "bit-gov-v2-staging"
database_id = "57139692-e530-4f86-814f-95ea957dba18"
