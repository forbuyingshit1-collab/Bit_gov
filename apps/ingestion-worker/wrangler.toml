[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "bit-gov-ingestion-staging"

[[queues.consumers]]
queue = "bit-gov-ingestion-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Cloudflare cron ใช้ UTC: 23:00 UTC = 06:00 Asia/Bangkok
# Saturday 19:00 UTC = Sunday 02:00 Asia/Bangkok
# ยังไม่เปิด triggers จนกว่า smoke capture และ row accounting จะผ่าน
# [triggers]
# crons = ["0 23 * * *", "0 19 * * 6"]

[vars]
APP_ENV = "staging"
CATALOG_RELAY_URL = "https://bit-gov-dashboard-gamma.vercel.app/api/internal/catalog"
SHARDING_ENABLED = "1"
